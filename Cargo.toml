# rc-photo ("Photos"): a gallery for RustCloud, a WASM plugin built on its own.
# Build: cargo build --release --target wasm32-wasip2
[package]
name = "rc-photo"
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of any workspace: built for wasm32-wasip2 on its own.
[workspace]
