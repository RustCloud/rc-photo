id = "rc-photo"
version = "0.8.1"
# The version of wit/app.wit: neural networks (use.onnx) need 0.2.13, settings
# with defaults 0.2.20, the files' own times (files.get-times) 0.2.21.
api = "^0.2.21"

# Batches of one user run one after another, whatever the administrator
# sets as workers: they rewrite the same files of the user's AppData.
one_batch_per_user = true

[name]
en = "Photos"
ru = "Фото"

# Photos stay where they are: the user gives the app folders. Writing is
# for deleting files from the gallery (since 0.2.0); it never changes them.
# Thumbnails and the index are kept in the user's AppData of the app.
# Faces (since 0.5.0, off until a user turns them on) and photo analysis
# (since 0.6.0: similar photos, text in photos) run neural networks on the
# server; it downloads them from Hugging Face.
[permissions]
files = "folder"
files_write = true
use = ["ffmpeg", "onnx"]
network = ["huggingface.co", "*.hf.co"]

# Finds faces and their 5 points: YOLO11n trained for faces (MIT).
[[downloads]]
path = "models/face-yolo11n-5kp.onnx"
url = "https://huggingface.co/huygiatrng/yolov11n-face-pose-5kp/resolve/main/face_5kp_yolo11n.onnx"
sha256 = "27ef93e9ccc9e1f49ecdb29d443d1b986c31c8e69230e19584e888fcec86984f"
size = 10982686

# A vector per face: ArcFace w600k_r50 of insightface's buffalo_l (for
# non-commercial use), as Immich publishes it.
[[downloads]]
path = "models/arcface-w600k-r50.onnx"
url = "https://huggingface.co/immich-app/buffalo_l/resolve/main/recognition/model.onnx"
sha256 = "4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43"
size = 174383860

# The administrator's switches, both on by default.
[[server_settings]]
key = "vision"
kind = "bool"
default = true
label = { en = "Photo analysis: similar photos, text in photos", ru = "Анализ фото: похожие фото, текст на фото" }
hint = { en = "A neural network looks at every photo once, in the background, a couple at a time.", ru = "Нейросеть один раз просматривает каждое фото, в фоне, по паре за раз." }

[[server_settings]]
key = "stories"
kind = "bool"
default = true
label = { en = "Stories", ru = "Истории" }
hint = { en = "A story a day from each user's photos.", ru = "Одна история в день из фото каждого пользователя." }

# Photo analysis: SigLIP 2 B/16 (Apache-2.0), its picture half, as Immich
# publishes it: a vector per photo, for similar photos. Another model:
# change this block and build again (see src/models.rs).
[[downloads]]
path = "models/clip-visual.onnx"
url = "https://huggingface.co/immich-app/ViT-B-16-SigLIP2__webli/resolve/5f3fc29104ebcf51e9d893af57604badd51a3ea6/visual/model.onnx"
sha256 = "fee10c729875dd203d94f396ac3d664e301d39c977ef6d92e7f467a2a716f0b0"
size = 371674292

# Text in photos: PaddleOCR's PP-OCRv5 mobile (Apache-2.0), where text is...
[[downloads]]
path = "models/ocr-det.onnx"
url = "https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/e6f4fa85f00e168c862bc462aebca69eef9b3d3d/inference.onnx"
sha256 = "a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d"
size = 4826518

# ...and what it says, in Cyrillic and Latin letters, with its characters.
[[downloads]]
path = "models/ocr-rec.onnx"
url = "https://huggingface.co/PaddlePaddle/cyrillic_PP-OCRv5_mobile_rec_onnx/resolve/2cef88145434beb8afa9dd82d77d799eb1ad7b29/inference.onnx"
sha256 = "5371ee1ddaa7983cc62d0818d99e982b6804638c85e4f960d59a574094e172e5"
size = 8048799

# Search by description (since 0.8.0): SigLIP 2's text half and its
# tokenizer. Large: the server needs `[onnx] max_model_mib = 1200` and
# `memory_mib = 3072` for it; with less, only this search is missing.
[[downloads]]
path = "models/clip-text.onnx"
url = "https://huggingface.co/immich-app/ViT-B-16-SigLIP2__webli/resolve/5f3fc29104ebcf51e9d893af57604badd51a3ea6/textual/model.onnx"
sha256 = "fc9991b415d7d0fac7ed540e875fd08a647c8a1abba99f12542531b004c4b68f"
size = 1129435819

[[downloads]]
path = "models/clip-text-tokenizer.json"
url = "https://huggingface.co/immich-app/ViT-B-16-SigLIP2__webli/resolve/5f3fc29104ebcf51e9d893af57604badd51a3ea6/textual/tokenizer.json"
sha256 = "220c63d496e0c14e63eb656c91e0215e926202e4c74b1f089e09f1920d779b04"
size = 34362885

[[downloads]]
path = "models/ocr-rec.yml"
url = "https://huggingface.co/PaddlePaddle/cyrillic_PP-OCRv5_mobile_rec_onnx/resolve/2cef88145434beb8afa9dd82d77d799eb1ad7b29/inference.yml"
sha256 = "5c76cc91fa98410178a09f498db10050d0ec1634a660053d3005ab7be581f501"
size = 6991

# Batches of one user run one after another (one_batch_per_user); workers
# is how many run at once for all users.
[limits]
memory = 2
time = 1
workers = 1

# One job per photo or video: read what it is, make its thumbnail. The server
# adds them itself when the user gives a folder and when files there change.
[[jobs]]
kind = "media"
batch = 20
time = 4
on = ["file.granted", "file.created", "file.changed", "file.deleted", "file.moved"]
mime = ["image/*", "video/*"]

# One job per folder for "Rebuild": its subfolders and files get jobs again.
[[jobs]]
kind = "scan"
batch = 20
time = 2

# For "Rebuild" too: drops what is in no granted folder any more.
[[jobs]]
kind = "prune"
batch = 1
time = 4

# One job per photo once faces are on: its faces and their vectors. The
# picture of a photo comes as a tensor of up to 1600 px (about 20 MB).
[[jobs]]
kind = "faces"
batch = 10
time = 8
memory = 4

# Photo analysis, two photos a batch so other work gets its turn soon: a
# vector per photo (SigLIP 2 takes a 224 px picture)...
[[jobs]]
kind = "clip"
batch = 2
time = 2

# ...and the text in it: the detector on a picture of up to 960 px, the
# recognizer on each line found (about 10 MB of pictures).
[[jobs]]
kind = "ocr"
batch = 2
time = 4
memory = 4

# A story a day (since 0.7.0), one a job: the day's photos are chosen
# from the whole index, read a shard at a time.
[[jobs]]
kind = "story"
batch = 1
time = 4
memory = 4

# Readies search by description (since 0.8.0), one job: the vocabulary
# made from the 34 MB tokenizer, the text model tried once.
[[jobs]]
kind = "describe"
batch = 1
time = 4
memory = 8

# Groups all the faces into people, after `faces` batches.
[[jobs]]
kind = "people"
batch = 1
time = 32
memory = 4

[ui]
icon = "image"
entry = "/app/rc-photo"
